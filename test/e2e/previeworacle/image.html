<!doctype html>
<meta charset="utf-8">
<script>window.EXCALIDRAW_ASSET_PATH = new URL("/editor-assets/", location.origin).href;</script>
<script type="module">
  import { convertToExcalidrawElements, exportToCanvas, exportToSvg } from "@excalidraw-yjs/excalidraw";
  import { LinearElementEditor, newEmbeddableElement, newFreeDrawElement, newIframeElement, Scene } from "@excalidraw-yjs/element";
  import { getStroke } from "perfect-freehand";
  import * as Y from "yjs";

  const fileId = "0123456789012345678901234567890123456789";
  const assetID = i => (100 + i).toString().padStart(40, "0");
  const locatorID = i => "8dba060a-6dc2-4486-9f4d-" + String(i).padStart(12, "0");
  const filesFor = (svg) => ({ [fileId]: {
    id: fileId,
    mimeType: "image/svg+xml",
    dataURL: "data:image/svg+xml;base64," + btoa(svg),
    created: 0,
  } });
  const outputSizes = [[500, 200], [410, 256]];
  const appState = { exportBackground: false };

  const rasterFiles = () => {
    const canvas = document.createElement("canvas");
    canvas.width = 64;
    canvas.height = 48;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#2040c0";
    ctx.fillRect(0, 0, 64, 48);
    ctx.fillStyle = "#20c040";
    ctx.fillRect(32, 0, 32, 48);
    return ["image/png", "image/jpeg", "image/webp", "image/gif"].map((mimeType, i) => {
      // First frame is opaque green; Canvas does not encode GIF.
      const dataURL = mimeType === "image/gif"
        ? "data:image/gif;base64,R0lGODlhAQABAIAAACCgQAAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw=="
        : canvas.toDataURL(mimeType, 0.95);
      if (!dataURL.startsWith("data:" + mimeType + ";base64,")) throw new Error("unsupported fixture encoder");
      return { id: assetID(i), mimeType, dataURL, created: 0 };
    });
  };

  const burstFiles = () => {
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = 256;
    const ctx = canvas.getContext("2d");
    return Array.from({ length: 32 }, (_, i) => {
      // Distinct image blobs with repeatable, nontrivial content. Resize
      // before placing in the test scene so decode size is independent of
      // displayed board size, like a user's pasted phone photo.
      const image = ctx.createImageData(256, 256);
      let n = i + 1;
      for (let p = 0; p < image.data.length; p += 4) {
        n ^= n << 13;
        n ^= n >>> 17;
        n ^= n << 5;
        image.data[p] = (n & 31) + ((p & 255) >> 2);
        image.data[p+1] = p >> 10;
        image.data[p+2] = (i * 6) & 255;
        image.data[p+3] = 255;
      }
      ctx.putImageData(image, 0, 0);
      return { id: assetID(i), mimeType: "image/png", dataURL: canvas.toDataURL(), created: 0 };
    });
  };

  const fit = (source, width, height) => {
    const output = document.createElement("canvas");
    output.width = width;
    output.height = height;
    const scale = Math.min(width / source.width, height / source.height);
    const w = source.width * scale, h = source.height * scale;
    output.getContext("2d").drawImage(source, (width - w) / 2, (height - h) / 2, w, h);
    return output;
  };

  window.exportFixture = async (svg) => {
    const elements = convertToExcalidrawElements([
      { type: "image", x: -13, y: -19, width: 64, height: 48, fileId, status: "saved", scale: [1, 1] },
    ]);
    const source = await exportToCanvas({
      elements,
      appState,
      exportPadding: 0,
      files: filesFor(svg),
    });
    return outputSizes.map(([width, height]) => {
      const output = fit(source, width, height);
      const { data } = output.getContext("2d").getImageData(width / 2, height / 2, 1, 1);
      return { width, height, source: [source.width, source.height], center: [...data] };
    });
  };

  window.exportMixedFixtures = async (svgAsset) => {
    const geometry = [
      { id: "box", type: "rectangle", x: -30, y: -20, width: 155, height: 97, seed: 20,
        backgroundColor: "#a5d8ff", fillStyle: "hachure", strokeColor: "#1971c2", roughness: 1 },
      { type: "ellipse", x: 18, y: 24, width: 93, height: 63, angle: 0.3, seed: 64,
        backgroundColor: "#ffc9c9", fillStyle: "solid", strokeColor: "#c92a2a", opacity: 73 },
      { type: "diamond", x: 110, y: 40, width: 86, height: 51, seed: 11,
        strokeStyle: "dashed", strokeWidth: 2, strokeColor: "#2b8a3e" },
      { type: "arrow", x: 179, y: 70, points: [[0, 0], [48, -21], [104, 15]], seed: 17,
        strokeColor: "#1864ab", endArrowhead: "triangle" },
      { type: "freedraw", x: 150, y: 23, seed: 222, strokeColor: "#6741d9", strokeWidth: 4,
        points: [[0, 0], [17, 4], [33, 16], [47, 7], [59, 11]],
        pressures: [0.17, 0.35, 0.8, 0.76, 0.3], simulatePressure: false },
      { type: "image", x: 111, y: -16, width: 64, height: 48, angle: 0.24, opacity: 71,
        fileId, status: "saved", scale: [1, 1] },
    ];
    const text = [
      { ...geometry[0], label: { text: "Bound\nlabel", fontSize: 16 } },
      ...geometry.slice(1),
      { type: "text", x: -17, y: 112, text: "Latin / Ελληνικά / 中文", fontSize: 19, fontFamily: 5 },
    ];
    const framed = [...geometry,
      { id: "clipped", type: "rectangle", x: 291, y: 56, width: 86, height: 76, seed: 29,
        strokeColor: "#e03131", backgroundColor: "#ffa8a8", fillStyle: "solid" },
      { type: "frame", x: 283, y: 17, width: 67, height: 91, name: "Frame", children: ["clipped"] },
    ];
    const items = [];
    for (const [name, skeletons] of [["geometry", geometry], ["framed", framed], ["text", text]]) {
      const elements = convertToExcalidrawElements(skeletons, { regenerateIds: false });
      const options = { elements, appState, files: filesFor(svgAsset), exportPadding: 10 };
      const source = await exportToCanvas(options);
      const vector = await exportToSvg(options);
      for (const [width, height] of outputSizes) {
        vector.setAttribute("width", String(width));
        vector.setAttribute("height", String(height));
        vector.setAttribute("preserveAspectRatio", "xMidYMid meet");
        const svg = new XMLSerializer().serializeToString(vector);
        const svgImage = new Image();
        svgImage.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        await svgImage.decode();
        items.push({
          name: name + "-" + width,
          svg,
          svgPng: fit(svgImage, width, height).toDataURL("image/png").split(",")[1],
          png: fit(source, width, height).toDataURL("image/png").split(",")[1],
        });
      }
    }
    return items;
  };

  window.exportSavedFixture = async (svgAsset, copies = 1, mode = "", extraCodecs = []) => {
    const sample = [
      { id: "under", type: "rectangle", x: -31, y: -24, width: 155, height: 97, seed: 20, roundness: null,
        backgroundColor: "#a5d8ff", fillStyle: "hachure", strokeColor: "#1971c2", roughness: 1 },
      { id: "overlay", type: "ellipse", x: 18, y: 24, width: 93, height: 63, angle: 0.3, seed: 64,
        backgroundColor: "#ffc9c9", fillStyle: "solid", strokeColor: "#c92a2a", opacity: 73 },
      { id: "diamond", type: "diamond", x: 110, y: 40, width: 86, height: 51, seed: 11, roundness: null,
        strokeStyle: "dashed", strokeWidth: 2, strokeColor: "#2b8a3e" },
      { id: "image", type: "image", x: 111, y: -16, width: 64, height: 48, angle: 0.24, opacity: 71,
        fileId, status: "saved", scale: [1, 1] },
      { id: "deleted", type: "rectangle", x: 1000, y: 1000, width: 100, height: 100, seed: 45,
        isDeleted: true, backgroundColor: "#000000", fillStyle: "solid" },
    ];
    const [deleted] = sample.splice(4, 1);
    if (mode === "text" || mode === "scripts") {
      sample.push({ id: "saved-text", type: "text", x: 2, y: 123,
        text: mode === "scripts" ? "Сafé / Γεια / Привет / 中" : "Line one\nSaved café",
        fontFamily: 5, fontSize: 23, textAlign: "center", strokeColor: "#343a40" });
    }
    if (mode === "cjk") {
      for (const [i, text] of ["視覚的に話し合う", "팀 협업을 위한 보드", "白板上的龜、龍和𠮷"].entries()) {
        sample.push({ id: "script-" + i, type: "text", x: 4, y: 117 + i * 36, text,
          fontFamily: 5, fontSize: 22, textAlign: "left", strokeColor: "#343a40" });
      }
    }
    if (mode === "fonts") {
      for (const [i, family] of [1, 2, 3, 5, 6, 7, 8, 9, 10].entries()) {
        sample.push({ id: "face-" + family, type: "text", x: (i % 3) * 145 + 45, y: 133 + Math.floor(i / 3) * 42,
          text: "Café Voilà", fontFamily: family, fontSize: 20, textAlign: "center", strokeColor: "#343a40" });
      }
    }
    if (mode === "frame") {
      sample.push(
        { id: "frame-child", type: "rectangle", x: 220, y: 28, width: 145, height: 42, seed: 57,
          roundness: null, roughness: 0, backgroundColor: "#d9480f", fillStyle: "solid", strokeColor: "#d9480f" },
        { id: "frame", type: "frame", x: 235, y: 32, width: 91, height: 78, name: "Test", children: ["frame-child"] },
      );
    }
    if (mode === "frame-group") {
      sample.push(
        { id: "frame-group-crossing", type: "rectangle", x: 220, y: 28, width: 115, height: 45, seed: 157,
          roundness: null, roughness: 0, angle:0.1, opacity:80,
          groupIds:["group"], backgroundColor:"#d9480f", fillStyle:"solid", strokeColor:"#d9480f" },
        { id: "frame-group-outside", type: "rectangle", x: 326, y: 76, width: 50, height: 47, seed: 159,
          roundness: null, roughness: 0, groupIds:["group"], backgroundColor:"#e64980", fillStyle:"solid" },
        { id: "magic", type:"magicframe", x:235,y:32,width:91,height:78,name:"Test",opacity:50,
          children:["frame-group-crossing","frame-group-outside"] },
        { id:"bound-marker",type:"rectangle",x:375,y:135,width:30,height:42,seed:186,strokeColor:"#0b7285" }
      );
    }
    if (mode === "arrow") {
      sample.push(
        { id: "arrow-underlay", type: "rectangle", x: 16, y: 102, width: 126, height: 59, seed: 47,
          roundness: null, roughness: 0, backgroundColor: "#e5dbff", fillStyle: "solid", strokeColor: "#e5dbff" },
        { id: "arrow", type: "arrow", x: -12, y: 109, points: [[0, 0], [100, 20], [174, 8]],
          roundness: null, roughness: 0, seed: 42, strokeWidth: 2, strokeColor: "#1864ab", endArrowhead: "triangle",
          label: { text: "saved arrow", fontSize: 18, fontFamily: 5, strokeColor: "#172b4d" } },
        { id: "elbow", type: "arrow", x: -12, y: 188, points: [[0, 0], [90, 0], [90, 63], [165, 63]],
          elbowed: true, seed: 426, roughness: 0, strokeWidth: 2, strokeStyle: "dotted", strokeColor: "#6f3b91",
          startArrowhead: "circle", endArrowhead: "arrow" },
      );
    }
    if (mode === "heads") {
      const heads = ["arrow", "bar", "circle", "circle_outline", "triangle", "triangle_outline", "diamond", "diamond_outline",
        "cardinality_one", "cardinality_many", "cardinality_one_or_many", "cardinality_exactly_one", "cardinality_zero_or_one",
        "cardinality_zero_or_many"];
      for (let i = 0; i < heads.length; i += 2) {
        sample.push({ id: "heads-" + i, type: "arrow", x: (i / 2 % 3) * 126, y: 128 + Math.floor(i / 6) * 61,
          points: [[0, 0], [54, 12], [99, 0]], roundness: null, roughness: 0, seed: 500 + i,
          strokeWidth: 2, strokeColor: "#6f3b91", startArrowhead: heads[i], endArrowhead: heads[i+1] });
      }
    }
    if (mode === "curves") {
      sample.push({ id: "curved-arrow", type: "arrow", x: 80, y: 151, angle: 0.38, seed: 124, roughness: 0,
        points: [[0, 0], [54, 84], [114, -12], [185, 43], [244, 3]], roundness: {type: 2},
        strokeColor: "#0c8599", startArrowhead: "bar", endArrowhead: "triangle_outline",
        label: {text:"Curve", fontSize: 18, fontFamily: 5} });
      sample.push({ id: "closed-filled", type: "line", x: 40, y: 241, angle: -0.32, width: 60, height: 80,
        points: [[0,0], [60,50], [10,80], [0,0]], strokeColor: "#5f3dc4", seed: 117, roughness: 0,
        backgroundColor: "#d0bfff", fillStyle: "solid", roundness: null });
      sample.push({ id: "even-curve", type: "arrow", x: 31, y: 432, angle: -0.28, seed: 175, roughness: 0,
        points: [[0, 0], [53, 104], [127, 103], [186, -20]], roundness: {type: 2},
        strokeColor: "#c2255c", endArrowhead: "triangle", label: {text:"Arc length", fontSize: 20, fontFamily: 5} });
    }
    if (mode === "pressure") {
      const points = [[0, 0], [12, 7], [24, 4], [33, 20], [52, 25], [70, 23], [86, 37], [111, 32]];
      sample.push(
        newFreeDrawElement({ type: "freedraw", id: "stylus", x: 20, y: 128, width: 111, height: 37, points, seed: 113, strokeWidth: 4,
          strokeColor: "#862e9c", pressures: [0.2, 0.3, 0.5, 0.77, 0.85, 0.42, 0.41, 0.1], simulatePressure: false }),
        newFreeDrawElement({ type: "freedraw", id: "mouse", x: 20, y: 182, width: 111, height: 37, points, seed: 211, strokeWidth: 2,
          strokeColor: "#0b7285", pressures: [], simulatePressure: true }),
      );
    }
    if (mode === "rounded") {
      sample.push(
        { id: "round-box", type: "rectangle", x: 20, y: 137, width: 175, height: 94, seed: 101,
          roundness: { type: 3 }, fillStyle: "cross-hatch", backgroundColor: "#b2f2bb", strokeColor: "#2b8a3e",
          label: { text: "Aligned\nlabel", fontSize: 18, fontFamily: 5, textAlign: "right" } },
        { id: "round-diamond", type: "diamond", x: 217, y: 144, width: 115, height: 76, seed: 224,
          roundness: { type: 2 }, strokeStyle: "dotted", fillStyle: "solid", backgroundColor: "#ffd8a8" },
      );
    }
    if (mode === "styles") {
      const fills = ["hachure", "cross-hatch", "solid", "zigzag"];
      const strokes = ["solid", "dashed", "dotted"];
      for (const [j, strokeStyle] of strokes.entries()) {
        for (const [i, fillStyle] of fills.entries()) {
          sample.push({ id:`style-${j}-${i}`, type: "rectangle", x: i*92, y: 116+j*53,
            width: 80, height:42, strokeWidth:3, roundness:null, seed:89+i+3*j,
            strokeStyle, fillStyle, roughness:j, strokeColor:"#2b8a3e", backgroundColor:"#96f2d7", opacity:80});
        }
      }
    }
    if (mode === "embeds") {
      sample.push(
        newEmbeddableElement({ id: "embed", type: "embeddable", x: 34, y: 138, width: 135, height: 64, seed: 112,
          backgroundColor: "transparent", strokeColor: "transparent", link: "https://example.invalid/card" }),
        newIframeElement({ id: "iframe", type: "iframe", x: 192, y: 138, width: 135, height: 64, seed: 114,
          backgroundColor: "transparent", strokeColor: "transparent" }),
        { id: "embed-under", type: "rectangle", x: 140, y: 151, width: 87, height: 31, seed: 116,
          roundness: null, strokeColor: "#087f5b", backgroundColor: "#087f5b", fillStyle: "solid" }
      );
    }
    if (mode === "captions") {
      sample.push(
        newEmbeddableElement({ id:"long-embed", type:"embeddable", x:26,y:137,width:144,height:75,seed:130,
          backgroundColor:"transparent",strokeColor:"transparent",
          link:"https://example.invalid/a-very-long-saved-reference/on-the-whiteboard/third"}),
        {id:"long-frame",type:"frame",x:208,y:138,width:105,height:75,children:[],
          name:"This stored frame title is long enough for an ellipsis"}
      );
    }
    if (mode === "crop") {
      svgAsset = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="48">
        <rect width="64" height="48" fill="#e03131"/><rect x="16" y="8" width="32" height="32" fill="#1971c2"/>
        <rect x="32" y="8" width="16" height="32" fill="#2f9e44"/></svg>`;
      Object.assign(sample[3], { x: 234, y: 18, width: 80, height: 80, angle: 0.2, opacity: 100,
        scale: [-1, 1], crop: { x: 16, y: 8, width: 32, height: 32, naturalWidth: 64, naturalHeight: 48 } });
    }
    const assets = { "8dba060a-6dc2-4486-9f4d-21d32216e939": svgAsset };
    const files = filesFor(svgAsset);
    const locators = { [fileId]: Object.keys(assets)[0] };
    if (mode === "codecs" || mode === "asset-burst") {
      const codecs = mode === "codecs"
        ? rasterFiles().concat(extraCodecs.map(({mimeType, dataURL}, i) => ({ id:assetID(4+i), mimeType, dataURL, created:0 })))
        : burstFiles();
      for (const [i, f] of codecs.entries()) {
        files[f.id] = f;
        locators[f.id] = locatorID(i);
        assets[locators[f.id]] = f.dataURL;
        sample.push({ id: "raster-" + i, type: "image", x: 10 + (i % 8) * 72, y: 120 + Math.floor(i / 8) * 57,
          width: 64, height: 48,
          fileId: f.id, status: "saved", scale: [1, 1] });
      }
    }
    const columns = mode === "shape-burst" ? 25 : 8;
    const board = copies === 1 ? sample : Array.from({ length: copies }, (_, i) =>
      sample.map(e => ({ ...e, id: e.id + "-" + i, x: e.x + (i % columns) * 240, y: e.y + Math.floor(i / columns) * 125 })),
    ).flat();
    const elements = convertToExcalidrawElements([...board, deleted], { regenerateIds: false });
    const scene = new Scene(elements);
    try {
      scene.mutateElement(scene.getElement("deleted"), { isDeleted: true });
      if (mode === "empty") {
        for (const e of scene.getElementsIncludingDeleted()) {
          scene.mutateElement(e, { isDeleted: true });
        }
      }
      scene.setAssetLocators(locators);
      scene.setAppState({ viewBackgroundColor: "#fffff0" });
      let saved = scene.encodeStateAsUpdate("v2");
      // The current client calls the exporter with api.getSceneElements(),
      // which excludes tombstones. Keep the tombstone in the saved V2 input.
      let live = scene.getElementsIncludingDeleted().filter(e => !e.isDeleted);
      if (mode === "tied" || mode === "missing-index") {
        const doc = new Y.Doc();
        try {
          Y.applyUpdateV2(doc, saved);
          const persisted = doc.getMap("elements");
          // Write in the inverse order of the ID tie-break. A stable
          // sort by fraction alone would produce the wrong layer order.
          if (mode === "tied") {
            persisted.get("under").set("index", persisted.get("overlay").get("index"));
            const decodedScene = new Scene(null, { doc });
            try {
              live = decodedScene.getElementsIncludingDeleted().filter(e => !e.isDeleted).map(e => ({...e}));
            } finally {
              saved = Y.encodeStateAsUpdateV2(doc);
              decodedScene.destroy();
            }
          } else {
            persisted.get("under").delete("index");
            saved = Y.encodeStateAsUpdateV2(doc);
          }
        } finally {
          doc.destroy();
        }
      }
      const outlines = {};
      const labelPositions = {};
      if (mode === "curves") {
        const elementsById = new Map(live.map(e => [e.id, e]));
        const arrow = elementsById.get("even-curve");
        const label = live.find(e => e.type === "text" && e.containerId === arrow.id);
        const {x, y} = LinearElementEditor.getBoundTextElementPosition(arrow, label, elementsById);
        labelPositions[arrow.id] = [x, y];
      }
      for (const e of live) {
        if (e.type !== "freedraw") continue;
        const input = e.simulatePressure ? e.points : e.points.map(([x, y], i) => [x, y, e.pressures[i]]);
        outlines[e.id] = getStroke(input, {
          size: e.strokeWidth * 4.25, thinning: 0.6, smoothing: 0.5, streamline: 0.5,
          simulatePressure: e.simulatePressure, easing: t => Math.sin(t * Math.PI / 2), last: true,
        });
      }
      const options = {
        elements: live,
        appState: { exportBackground: true, viewBackgroundColor: "#fffff0" },
        exportPadding: 10,
        files,
      };
      const source = await exportToCanvas(options);
      const outputs = [];
      const sizes = mode.endsWith("-burst") ? [[1800, 720], [410, 256]] : outputSizes;
      for (const [width, height] of sizes) {
        // Comparison control: rasterize at the target scale before letterboxing
        // rather than rasterizing at 1× and downsampling a populated bitmap.
        const scaled = await exportToCanvas({ ...options, getDimensions: (w, h) => {
          const scale = Math.min(width / w, height / h);
          return { width: w * scale, height: h * scale, scale };
        } });
        outputs.push({
          width, height,
          png: fit(source, width, height).toDataURL("image/png").split(",")[1],
          directPng: fit(scaled, width, height).toDataURL("image/png").split(",")[1],
        });
      }
      let binary = "";
      for (let i = 0; i < saved.length; i += 8192) {
        binary += String.fromCharCode(...saved.subarray(i, i + 8192));
      }
      return {
        snapshot: btoa(binary),
        // Out-of-band trusted test fixture: no URL in the checkpoint is fetched.
        assets,
        mode,
        outlines,
        labelPositions,
        order: live.map(e => e.id),
        source: [source.width, source.height],
        outputs,
      };
    } finally {
      scene.destroy();
    }
  };
</script>
