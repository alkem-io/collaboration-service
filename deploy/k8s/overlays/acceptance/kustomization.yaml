# collaboration-service — ACCEPTANCE overlay (WS-E / infra-ops T001).
#
# The acceptance environment (GitOps target: the ACC deploy PR → develop). Smaller
# footprint than prod; self-hosted Redis from the base; acceptance domain + the
# acceptance-scoped file-service bucket id.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alkemio

resources:
  - ../../base

images:
  - name: ghcr.io/alkem-io/collaboration-service
    newTag: latest # release-deploy bumps this to the released SHA/version tag

replicas:
  - name: collaboration-service
    count: 2

patches:
  # Acceptance host + the acceptance file-service bucket id.
  - target:
      kind: Ingress
      name: collaboration-service
    patch: |
      - op: add
        path: /spec/rules/0/host
        value: collaboration.acc.alkem.io
  - target:
      kind: ConfigMap
      name: collaboration-service-config
    patch: |
      - op: replace
        path: /data/FILE_SERVICE_STORAGE_BUCKET_ID
        value: "ACC-FILE-SERVICE-BUCKET-UUID"
      - op: replace
        path: /data/FILE_SERVICE_AUTHORIZATION_ID
        value: "ACC-FILE-SERVICE-AUTHORIZATION-UUID"
