# collaboration-service SECRET TEMPLATE (WS-E / infra-ops T003).
#
# !!! DO NOT COMMIT REAL VALUES !!!  This is the SHAPE of the secret only. In
# infrastructure-operations these values come from the environment's secret store
# (today: committed/sealed secrets per environment; transitioning to Vault +
# Pulumi — see the workspace memory note on the infra transition). The keys here
# are exactly the env vars the adapters read (internal/config).
apiVersion: v1
kind: Secret
metadata:
  name: collaboration-service-secrets
  labels:
    app: collaboration-service
type: Opaque
stringData:
  # Redis fan-out (FANOUT_MODE=redis). The bundled collaboration-redis (redis.yaml)
  # runs WITHOUT requirepass, so the default URL has no password — a credential
  # would make clients send AUTH and fail against the no-auth relay. When pointing
  # at a managed/secured Redis instead, add the password: "redis://:PASSWORD@host:6379".
  REDIS_URL: "redis://collaboration-redis:6379"

  # RabbitMQ metadata bus credentials (host/user/pass; queue is in the ConfigMap).
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "CHANGE_ME"
  RABBITMQ_PASSWORD: "CHANGE_ME"

# NOTE: the file-service bucket/authorization ids are environment reference UUIDs,
# not credentials — they live in the ConfigMap (overlay-patched), not here.
