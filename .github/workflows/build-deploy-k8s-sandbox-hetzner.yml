name: Build & Deploy Collaboration Service to Sandbox on Hetzner

on:
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
    uses: alkem-io/github-workflows/.github/workflows/deploy-hetzner.yml@v1
    with:
      environment: sandbox
      # image / deployment / container / pull-secret names all match the
      # org conventions derived from the repo name — no overrides needed.
    secrets:
      KUBECONFIG: ${{ secrets.KUBECONFIG_SECRET_HETZNER_SANDBOX }}
      REGISTRY_LOGIN_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
