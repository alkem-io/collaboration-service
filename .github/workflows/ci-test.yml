name: CI — Lint & Test

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci:
    # Central org CI (lint · race tests · build). `go test ./...` also runs the
    # CRDT core's backend/conformance suites, which live as ordinary tests beside
    # each port implementation (FR-008, SC-006) — no extra CI wiring is needed for
    # them, and a failing contract fails the build like any other test.
    #
    # The OpenAPI staleness gate stays disabled: this service is WebSocket-first
    # and its only REST surface is the standalone create endpoint plus /healthz,
    # neither of which justifies the gate. The standalone deployment itself was
    # withdrawn by constitution v3.0.0 §III.
    # Pinned to an immutable commit rather than the mutable @v1 tag. This is a
    # reusable workflow from a PERSONAL namespace, invoked here with
    # packages:write — retagging v1 there would change what runs with image-push
    # rights, with no review in this repository. The SHA below is what v1
    # resolved to when it was pinned; behaviour is unchanged.
    uses: antst/alkemio-github-workflows/.github/workflows/go-ci.yml@ab4acc18e4f2551c03e2df8d2f436f0b013152f4 # v1
    permissions:
      contents: read
    with:
      run-vet: true
