name: CI — Lint & Test

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci:
    # Central org CI (lint · race tests · build). The OpenAPI staleness gate is
    # intentionally not enabled yet: this service is WebSocket-first and exposes
    # no apispec-annotated REST surface in Phase 1. It is added (with
    # `openapi-make-target: openapi`) when the standalone create/delete HTTP API
    # lands (task T016 of specs/003-unify-collab-yjs/tasks/collaboration-service.md).
    uses: antst/alkemio-github-workflows/.github/workflows/go-ci.yml@v1
    permissions:
      contents: read
    with:
      run-vet: true
