name: CI — Integration & Coverage Gate

# Brings the build-tagged integration suites (redis / postgres / rabbitmq)
# and the e2e suite (incl. the real yjs + y-protocols JS-client interop harness)
# into CI against live backends, then enforces the ≥95% combined coverage gate
# (T017.5, SC-008/SC-011). The fast lint · race · build lane stays in ci-test.yml
# (central go-ci@v1); this workflow is the durable-backend + coverage lane.

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  integration-coverage:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: collab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collab -d collab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

      rabbitmq:
        # Pinned to the exact version floor the lifecycle topology declares
        # (lifecycle.MinBrokerVersion), so CI proves the floor is SUFFICIENT rather
        # than merely that some newer broker happens to work. Below it, a quorum
        # queue accepts x-message-ttl and x-dead-letter-strategy, echoes them back,
        # and expires nothing — measured on 3.9.13 — so an unpinned `rabbitmq:3`
        # could silently drift under the floor and take the retry ladder with it.
        #
        # -management, not -alpine: the retention assertion needs a queue's TOTAL
        # message count, and a message held for a pending dead-letter hop is neither
        # ready nor unacknowledged, so queue.declare-ok cannot see it. Only the
        # management API exposes the number.
        image: rabbitmq:3.13.2-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 12

    env:
      # Integration-suite backend wiring (the build-tagged tests skip when unset).
      POSTGRES_TEST_DSN: postgres://collab:secret@localhost:5432/collab_test?sslmode=disable
      RABBITMQ_TEST_URL: amqp://guest:guest@localhost:5672/
      RABBITMQ_MANAGEMENT_URL: http://guest:guest@localhost:15672

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node (for the y-protocols JS-interop harness)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS-interop harness deps
        working-directory: test/e2e/jsinterop
        run: npm ci

      # This step takes ~6 minutes, and most of that is three lifecycle tests that
      # wait on a real broker: the parked dead-letter hop recovers on RabbitMQ's
      # own ~3-minute retry cycle, the retention assertion needs a TTL longer than
      # the management API's statistics interval, and the ladder round-trip is
      # gated by the shipped 30s first tier. None of that can be made faster
      # without measuring something other than the broker.
      #
      # Those tests are t.Skip'd under -short, so adding -short here looks like a
      # free six minutes. It is not: it silently deletes the only assertions that
      # prove the retry ladder works against a real 3.13.2 — the behaviour 3.9.13
      # accepts, echoes back, and never performs. Reviewed and kept deliberately;
      # see specs/003-go-yjs-core-port/contracts/lifecycle-retry-runbook.md.
      - name: Integration + e2e + coverage gate (≥95%)
        run: ./.scripts/coverage-gate.sh 95.0

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage-merged.out
          if-no-files-found: ignore
